[build-system]
requires = ["setuptools>=68.0", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-rtl-processor"
version = "1.0.0"
description = "Blazing fast Arabic RTL text processor for LTR terminals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Basel"}
]
keywords = ["arabic", "rtl", "bidi", "terminal", "cython", "performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/baselCS/arabic-rtl-processor"
Repository = "https://github.com/baselCS/arabic-rtl-processor"
Issues = "https://github.com/baselCS/arabic-rtl-processor/issues"

[project.scripts]
arabic-rtl = "arabic_rtl_cli:main"

[tool.setuptools]
py-modules = ["arabic_rtl_cli"]
